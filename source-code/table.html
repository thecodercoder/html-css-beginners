<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Tables</title>
</head>

<body>
  <h1>HTML Tables</h1>

  <table border="1">
    <thead>
      <tr>
        <th>Animal Name</th>
        <th># of Legs</th>
        <th>Animal Type</th>
        <th>Habitat</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th>horse</th>
        <td>4</td>
        <td>mammal</td>
        <td rowspan="2">farm</td>
      </tr>
      <tr>
        <th>cow</th>
        <td>4</td>
        <td>mammal</td>
      </tr>
      <tr>
        <th>hawk</th>
        <td>2</td>
        <td>bird</td>
        <td>forest</td>
      </tr>
    </tbody>


  </table>

</body>

</html>
